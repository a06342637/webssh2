services:
  webssh:
    build: .
    container_name: webssh
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8008}:${PORT:-8008}"
    environment:
      - port=${PORT:-8008}
      - savePass=${SAVE_PASS:-true}
      - showFooter=${SHOW_FOOTER:-true}
      - WEBSSH_DATA_DIR=/app/data
      - WEBSSH_ADMIN_USER=${WEBSSH_ADMIN_USER:-admin}
      - WEBSSH_ADMIN_PASSWORD=${WEBSSH_ADMIN_PASSWORD:-}
      - WEBSSH_ADMIN_RESET=${WEBSSH_ADMIN_RESET:-false}
      - WEBSSH_REQUIRE_ACCOUNT=${WEBSSH_REQUIRE_ACCOUNT:-false}
      - WEBSSH_ENABLE_SELF_UPDATE=${WEBSSH_ENABLE_SELF_UPDATE:-false}
      - WEBSSH_TERMINAL_WS_URL=${WEBSSH_TERMINAL_WS_URL:-}
      - WEBSSH_EDITOR_MAX_BYTES=${WEBSSH_EDITOR_MAX_BYTES:-2097152}
      - WEBSSH_PREVIEW_MAX_BYTES=${WEBSSH_PREVIEW_MAX_BYTES:-134217728}
      - WEBSSH_SFTP_SESSION_IDLE_SECONDS=${WEBSSH_SFTP_SESSION_IDLE_SECONDS:-120}
      - WEBSSH_MAX_SFTP_SESSIONS=${WEBSSH_MAX_SFTP_SESSIONS:-32}
      - WEBSSH_MAX_SFTP_SESSIONS_PER_CLIENT=${WEBSSH_MAX_SFTP_SESSIONS_PER_CLIENT:-4}
      # Uncomment to enable basic auth for the web UI:
      # - authInfo=admin:your_password
    env_file:
      - path: .env
        required: false
    volumes:
      - webssh_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${PORT:-8008}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  webssh_data:

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd42:7765:6273:7368::/64
